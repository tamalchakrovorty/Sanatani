<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanatani Community - North South University</title>
<meta name="description" content="Culture, events, memories and stories from the Sanatani Community at North South University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Marcellus&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6E1423;--maroon-deep:#450C16;--saffron:#E58A2B;--gold:#D4A03A;--gold-soft:#F2D592;
  --bg:#FBF6EB;--surface:#FFFDF8;--surface-2:#F4EAD5;--text:#2A2321;--soft:#6A5D55;--line:#E5D8BE;
  --btn-bg:#6E1423;--btn-text:#FFF6E6;--link:#8A1C2E;--accent-text:#8A4B0A;--err:#B3261E;
  --header-bg:rgba(251,246,235,.93);--toast-bg:#2A2321;--toast-text:#FFF6E6;
  --serif:'Marcellus','Tiro Bangla',Georgia,serif;
  --sans:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#160C0E;--surface:#211215;--surface-2:#2A171A;--text:#F4EADB;--soft:#BBA99A;--line:#3B2428;
    --btn-bg:#E9A84E;--btn-text:#2B1207;--link:#F0B25E;--accent-text:#F0B25E;--err:#FF9A90;
    --header-bg:rgba(22,12,14,.93);--toast-bg:#F4EADB;--toast-text:#2A2321;
  }
}
:root[data-theme="dark"]{
  --bg:#160C0E;--surface:#211215;--surface-2:#2A171A;--text:#F4EADB;--soft:#BBA99A;--line:#3B2428;
  --btn-bg:#E9A84E;--btn-text:#2B1207;--link:#F0B25E;--accent-text:#F0B25E;--err:#FF9A90;
  --header-bg:rgba(22,12,14,.93);--toast-bg:#F4EADB;--toast-text:#2A2321;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
svg{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.16;margin:0 0 .6rem;letter-spacing:.005em}
h1{font-size:clamp(2.1rem,5vw,3.5rem)}h2{font-size:clamp(1.65rem,3.2vw,2.4rem)}h3{font-size:1.28rem}h4{font-size:1.05rem}
p{margin:0 0 1rem}a{color:var(--link)}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
.sec{padding:clamp(2.6rem,6vw,4.6rem) 0}.sec.alt{background:var(--surface-2)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}.sh h2{margin:0}
.lnk{font-weight:600;text-decoration:none;border-bottom:2px solid var(--saffron);white-space:nowrap;padding-bottom:1px}
.soft{color:var(--soft)}.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
::selection{background:var(--gold-soft);color:#2a1108}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.68rem 1.2rem;border-radius:10px;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-text);font:600 .98rem/1.2 var(--sans);text-decoration:none;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--link);border-color:var(--line)}
.btn-gold{background:var(--saffron);border-color:var(--saffron);color:#2b1207}
.btn-light{background:transparent;color:#FFF3DE;border-color:rgba(255,243,222,.55)}
.btn-sm{padding:.48rem .9rem;font-size:.9rem}.btn-lg{padding:.85rem 1.6rem;font-size:1.05rem}.btn-block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:.6rem}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--text);cursor:pointer}
.ib:hover{background:var(--surface-2)}


/* demo bar + header */
.demo{background:var(--maroon-deep);color:#F2D592;font-size:.82rem;display:flex;gap:.5rem;justify-content:center;align-items:center;padding:.35rem 2.2rem;text-align:center;position:relative}
.demo button{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;font-size:1.2rem;cursor:pointer;line-height:1}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{width:min(1320px,100% - 1.6rem)}
.hdr-in{display:flex;align-items:center;gap:.6rem;min-height:66px}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text);min-width:0}
.nsu{display:inline-block;flex:none;width:62px;height:auto;object-fit:contain}
.brand svg{flex:none}.brand-txt{line-height:1.1;display:block}.brand-txt b{display:block;font:400 1rem/1.1 var(--serif)}.brand-txt span{display:block;font-size:.74rem;color:var(--soft);margin-top:2px}
.nav{display:none}
.hdr-act{margin-left:auto;display:flex;align-items:center;gap:.3rem}
.hide-sm{display:none}
@media(max-width:520px){.hdr .brand-txt span{display:none}.hdr .brand-txt b{font-size:.95rem}.hdr .nsu{width:52px}.hdr .brand svg{width:42px;height:42px}}
@media(min-width:1200px){
  .nav{display:flex;margin-left:auto;align-items:center}.hdr-act{margin-left:.6rem}.burger{display:none}.hide-sm{display:inline-grid}
  .nav a{padding:.5rem .58rem;font-size:.93rem;color:var(--text);text-decoration:none;border-radius:8px;display:block;white-space:nowrap}
  .nav a:hover{background:var(--surface-2)}.nav a[aria-current="page"]{color:var(--link);box-shadow:inset 0 -2px 0 var(--saffron);border-radius:0}
  .dd{position:relative}.dd-menu{position:absolute;top:100%;left:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.35rem;display:none;box-shadow:0 14px 32px rgba(60,10,20,.16)}
  .dd:hover .dd-menu,.dd:focus-within .dd-menu{display:block}
}
.mnav{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + .8rem) 1.25rem 2rem}
.mnav-x{position:absolute;right:.8rem;top:calc(env(safe-area-inset-top,0px) + .6rem)}
.mnav nav{margin:3.2rem 0 1.4rem}.mnav nav a{display:block;padding:.6rem 0;font:400 1.55rem/1.2 var(--serif);color:var(--text);text-decoration:none;border-bottom:1px solid var(--line)}
.mnav nav a.sub{font:500 1rem var(--sans);padding:.4rem 0 .4rem 1rem;color:var(--soft);border:0}
.mnav .foot{display:flex;gap:.6rem;flex-wrap:wrap}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 100% at 78% 18%,#8A2233 0%,var(--maroon) 42%,var(--maroon-deep) 100%);color:#FFF3DE}
.hero-mand{position:absolute;width:min(560px,130vw);aspect-ratio:1;left:62%;top:18%;transform:translate(-50%,-50%);opacity:.3;pointer-events:none}
.hero-mand svg,.ph-mand svg{width:100%;height:100%}
@media(min-width:900px){.hero-mand{width:700px;left:73%;top:50%;opacity:.85}}
@media(prefers-reduced-motion:no-preference){.hero-mand svg{animation:spin 320s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-in{position:relative;display:grid;gap:2.2rem;align-items:center;padding:clamp(2.4rem,7vw,5rem) 0 clamp(2.8rem,7vw,5rem)}
@media(min-width:900px){.hero-in{grid-template-columns:1.08fr .92fr;gap:3rem}}
.hero .bn{font:400 1.2rem/1.3 var(--serif);color:var(--gold-soft);margin-bottom:.9rem}
.hero h1{font-size:clamp(2.4rem,6vw,4.3rem);line-height:1.06;margin-bottom:1.1rem;max-width:14em}
.hero .lede{font-size:1.12rem;max-width:34em;color:#F3DFC2;margin-bottom:1.6rem}
.feat{background:rgba(58,9,19,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(242,213,146,.4);border-radius:18px;padding:.8rem;max-width:400px;justify-self:center;width:100%}
.feat-img{aspect-ratio:10/8;border-radius:50% 50% 10px 10px/38% 38% 10px 10px;overflow:hidden}
.feat-img svg{width:100%;height:100%}
.feat-b{padding:1rem .5rem .5rem}.feat-b h2{font-size:1.7rem;margin-bottom:.4rem}
.feat-k{color:var(--gold-soft);font-size:.92rem;margin:0 0 .25rem}
.meta{display:flex;align-items:center;gap:.5rem;margin:0 0 .3rem;font-size:.96rem;color:inherit}.meta svg{flex:none;opacity:.8}
.feat .btns{margin-top:.9rem}

/* page head */
.phead{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--maroon-deep),var(--maroon));color:#FFF3DE;padding:clamp(2.2rem,5vw,3.6rem) 0}
.phead .wrap{position:relative}.phead h1{margin-bottom:.5rem}.phead .lede{color:#F0DAB9;max-width:40em;margin:0;font-size:1.08rem}
.crumb{font-size:.88rem;color:var(--gold-soft);margin-bottom:.7rem}.crumb a{color:inherit;text-decoration:none}.crumb a:hover{text-decoration:underline}
.ph-mand{position:absolute;right:-120px;top:-140px;width:460px;height:460px;opacity:.16;pointer-events:none}

/* notices */
.notices{display:grid;gap:.9rem}
@media(min-width:900px){.notices{grid-template-columns:1.25fr 1fr}.nt-first{grid-row:span 2}}
.nt{display:flex;gap:1rem;padding:1.1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--saffron);border-radius:4px 14px 14px 4px;text-decoration:none;color:var(--text)}
.nt:hover{border-left-color:var(--maroon)}
.nt-first{background:linear-gradient(135deg,var(--maroon-deep),var(--maroon));border-color:var(--maroon);border-left-color:var(--saffron);color:#FFF3DE}
.nt-first .chip{background:rgba(242,213,146,.2);color:var(--gold-soft)}
.nt-d{flex:none;text-align:center;min-width:52px;font-family:var(--serif)}.nt-d b{display:block;font:400 2rem/1 var(--serif)}.nt-d span{font-size:.9rem;opacity:.8}
.nt h3{margin:.35rem 0 .3rem;font-size:1.18rem}.nt p{margin:0;font-size:.96rem;opacity:.9}.nt-first h3{font-size:1.5rem}
.chip{display:inline-block;padding:.12rem .6rem;border-radius:999px;background:var(--surface-2);color:var(--accent-text);font-size:.8rem;font-weight:600}

/* event cards */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-1.25rem;padding:0 1.25rem .6rem;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}.rail>*{scroll-snap-align:start}
@media(min-width:800px){.rail{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-auto-columns:auto;overflow:visible;margin:0;padding:0}}
.grid{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.evc-img{position:relative;display:block;margin:.6rem .6rem 0;aspect-ratio:10/10.4;border-radius:50% 50% 10px 10px/30% 30% 10px 10px;overflow:hidden}
.evc-img svg{width:100%;height:100%;transition:transform .5s}.evc-img:hover svg{transform:scale(1.04)}
.evc-b{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.15rem;flex:1}
.evc h3{margin-bottom:.35rem}.evc h3 a{color:inherit;text-decoration:none}.evc h3 a:hover{color:var(--link)}
.evc .meta{color:var(--soft);font-size:.92rem}.evc .btns{margin-top:auto;padding-top:.8rem}
.pill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:.15rem .7rem;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--saffron);color:#2b1207;white-space:nowrap}
.pill.ongoing{background:#2F7D5B;color:#fff}.pill.past{background:#e9e0cf;color:#4a3f38}
.pill-i{position:static;transform:none;display:inline-block}

/* countdown */
.band{background:var(--maroon-deep);color:#FFF3DE;padding:clamp(2rem,5vw,3.2rem) 0}
.band-in{display:grid;gap:1.4rem;align-items:center}@media(min-width:900px){.band-in{grid-template-columns:1fr auto}}
.band h2{margin-bottom:.2rem}.band p{margin:0;color:var(--gold-soft)}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;min-width:min(100%,380px)}
.cd>div{border:1px solid rgba(242,213,146,.45);border-radius:12px;padding:.7rem .3rem;text-align:center;background:rgba(0,0,0,.14)}
.cd b{display:block;font:400 clamp(1.8rem,5vw,2.7rem)/1 var(--serif);font-variant-numeric:tabular-nums;color:#FFF3DE}
.cd span{font-size:.8rem;color:var(--gold-soft)}
.cd-done{grid-column:1/-1;font:400 1.5rem var(--serif);color:var(--gold-soft);margin:0;text-align:center}
.cd-sm b{font-size:1.6rem}

/* stories */
.stories{display:grid;gap:1.4rem}@media(min-width:900px){.stories{grid-template-columns:1.3fr 1fr}}
.story-big{display:block;text-decoration:none;color:inherit}
.story-img{aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:1rem}.story-img svg{width:100%;height:100%}
.story-big h3{font-size:1.75rem}.story-big:hover h3{color:var(--link)}
.story-list{display:grid;gap:1rem;align-content:start}
.story-s{display:grid;grid-template-columns:110px 1fr;gap:1rem;text-decoration:none;color:inherit;align-items:center}
.story-s .story-img{aspect-ratio:1;margin:0;border-radius:10px}.story-s h3{font-size:1.1rem;margin:.2rem 0 0}.story-s:hover h3{color:var(--link)}
.date{font-size:.86rem;color:var(--soft)}

/* gallery */
.mosaic{display:grid;gap:.6rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.mosaic{grid-template-columns:repeat(4,1fr);grid-auto-rows:190px}.mosaic .w2{grid-column:span 2}.mosaic .h2{grid-row:span 2}}
.tile{position:relative;display:block;overflow:hidden;border-radius:6px;aspect-ratio:1;border:0;padding:0;cursor:pointer;background:var(--surface-2);width:100%}
@media(min-width:800px){.mosaic .tile{aspect-ratio:auto;height:100%}}
.tile svg{width:100%;height:100%;object-fit:cover;transition:transform .5s}.tile:hover svg{transform:scale(1.05)}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.18)}
.tile .play i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid #fff}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .8rem .6rem;background:linear-gradient(transparent,rgba(20,4,8,.75));color:#fff;font-size:.9rem;text-align:left}
.walls{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.albums{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.alb{display:block;text-decoration:none;color:inherit}.alb .story-img{aspect-ratio:4/3;margin-bottom:.7rem}.alb h3{margin-bottom:.1rem}.alb:hover h3{color:var(--link)}

/* partners */
.logos{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;gap:.6rem;font:400 1.05rem var(--serif)}
.mono{display:inline-grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;color:#fff;font:400 .95rem var(--serif);letter-spacing:.03em}
.pship{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;display:grid;gap:1rem}
@media(min-width:800px){.pship{grid-template-columns:1fr 1.2fr;align-items:center}}
.pship-t{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.pship-t>div{aspect-ratio:1;border-radius:6px;overflow:hidden}.pship-t svg{width:100%;height:100%}
.pship h3{margin:.3rem 0 .3rem}

/* stats + timeline */
.ledger{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem 0}
@media(min-width:800px){.ledger{grid-template-columns:repeat(4,1fr)}}
.ledger>div{padding:.2rem 1.2rem;border-left:1px solid var(--line)}
.ledger b{display:block;font:400 clamp(2.1rem,4vw,3rem)/1.05 var(--serif);color:var(--link)}.ledger span{color:var(--soft);font-size:.95rem}
.tl{border-left:2px solid var(--gold);margin:0 0 0 .5rem;padding:0 0 0 1.5rem;list-style:none}
.tl li{position:relative;padding-bottom:1.6rem}.tl li::before{content:"";position:absolute;left:-1.5rem;top:.5rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--saffron);transform:translateX(-7px)}
.tl b{font:400 1.5rem var(--serif);color:var(--link);display:block}.tl p{margin:0;max-width:40em}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.sched li{display:grid;grid-template-columns:110px 1fr;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}.sched b{font-weight:600;color:var(--accent-text)}

/* CTA */
.cta{background:linear-gradient(135deg,var(--maroon-deep),var(--maroon));color:#FFF3DE;border-radius:20px;padding:clamp(1.8rem,5vw,3.2rem);display:grid;gap:1.4rem;position:relative;overflow:hidden}
.cta .ph-mand{right:-100px;top:-90px;opacity:.14}.cta>*:not(.ph-mand){position:relative}.cta h2{margin-bottom:.4rem}.cta p{color:#F0DAB9;max-width:34em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}

/* tabs */
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.1rem 0 .5rem;margin-bottom:1.2rem;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;white-space:nowrap;font-size:.95rem;cursor:pointer;font-family:inherit}
.tab[aria-current="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-text)}
.tab small{opacity:.7;margin-left:.3rem}

/* segmented toggle */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:.55rem 1rem;border:none;background:transparent;color:var(--text);font:inherit;font-size:.9rem;cursor:pointer;transition:background .15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-text)}

/* two column layouts */
.cols{display:grid;gap:2rem;align-items:start}@media(min-width:960px){.cols{grid-template-columns:1fr 340px}.cols.wide{grid-template-columns:1fr 400px}.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.3rem}
.box h3{margin-bottom:.8rem}
.ev-head{display:grid;gap:1.6rem;align-items:center}@media(min-width:860px){.ev-head{grid-template-columns:1fr 300px}}
.ev-arch{aspect-ratio:10/11.5;max-width:300px;width:100%;border-radius:50% 50% 12px 12px/34% 34% 12px 12px;overflow:hidden;border:1px solid rgba(242,213,146,.4);justify-self:center}.ev-arch svg{width:100%;height:100%}
.ev-head .meta{font-size:1.02rem;margin-bottom:.4rem}
.tt{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}.tt:last-of-type{border-bottom:0}
.tt b{display:block;font-weight:600}.tt small{color:var(--soft)}.price{font:400 1.2rem var(--serif);white-space:nowrap}
.prose{max-width:42em;font-size:1.08rem;line-height:1.75}.prose p{margin-bottom:1.1rem}
.article-img{aspect-ratio:16/8;border-radius:14px;overflow:hidden;margin:1.4rem 0}.article-img svg{width:100%;height:100%}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}.cal-h h2{margin:0;font-size:1.6rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{font-size:.82rem;color:var(--soft);text-align:center;padding:.3rem 0}
.cal-d{min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.3rem .4rem;text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-d.off{background:transparent;border-color:transparent}
.cal-d.today{border-color:var(--saffron);box-shadow:inset 0 0 0 1px var(--saffron)}
.cal-d.has{cursor:pointer;background:var(--maroon);border-color:var(--maroon);color:#FFF3DE}.cal-d.has:hover{filter:brightness(1.15)}
.cal-d.sel{outline:3px solid var(--saffron)}

/* ---------- store: live data + API persistence ----------
   Every collection is a plain array that is mutated in place, so views can hold references.
   Data is fetched from the Express/PostgreSQL backend via REST API. */
const API_BASE=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:3001':'';
let AUTH_TOKEN=localStorage.getItem('sanatani_token')||null;

const COLLECTIONS={events:EV,albums:ALB,partners:P,partnerships:PS,posts:POSTS,notices:NT,timeline:TL,stats:STATS,orders:ORDERS,donations:DONS,messages:MSGS,users:USERS};
const TIX_CAP={General:300,Student:200,Couple:80,VIP:40};

/* ---------- API helpers ---------- */
async function apiFetch(path,opts={}){
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(AUTH_TOKEN)headers['Authorization']='Bearer '+AUTH_TOKEN;
  const res=await fetch(API_BASE+'/api/'+path,Object.assign({},opts,{headers}));
  if(!res.ok){const e=await res.json().catch(()=>({error:'Request failed'}));throw new Error(e.error||res.statusText)}
  return res.json();
}
function apiUpload(file){
  return new Promise((resolve,reject)=>{
    const fd=new FormData();fd.append('file',file);
    const xhr=new XMLHttpRequest();
    xhr.open('POST',API_BASE+'/api/upload');
    if(AUTH_TOKEN)xhr.setRequestHeader('Authorization','Bearer '+AUTH_TOKEN);
    xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve(JSON.parse(xhr.responseText));else reject(new Error('Upload failed'))};
    xhr.onerror=()=>reject(new Error('Network error'));
    xhr.send(fd);
  });
}

/* ---------- fill in-memory arrays from API data ---------- */
function fillDB(src){
  const map={events:EV,albums:ALB,partners:P,partnerships:PS,posts:POSTS,notices:NT,timeline:TL,stats:STATS,orders:ORDERS,donations:DONS,messages:MSGS,users:USERS};
  for(const k in map)map[k].splice(0,map[k].length,...(src[k]||[]));
  Object.keys(SETTINGS).forEach(k=>delete SETTINGS[k]);Object.assign(SETTINGS,DEFAULT_SETTINGS,src.settings||{});
}

/* ---------- load from API ---------- */
async function loadDB(){
  try{
    const endpoint=AUTH_TOKEN?'admin/all':'public/all';
    const data=await apiFetch(endpoint);
    fillDB(data);
  }catch(err){
    console.warn('API unavailable, using seed data:',err.message);
    fillDB(seedAll());
  }
}

/* ---------- published-only views ---------- */
const isPub=x=>x.pub!==false;
const EVp=()=>EV.filter(isPub),POSTp=()=>POSTS.filter(isPub),NTp=()=>NT.filter(isPub);
const ALBp=()=>ALB.filter(a=>isPub(a)&&EV.some(e=>e.id===a.ev&&isPub(e)));
const look=f=>new Proxy({},{get:(_,id)=>typeof id==='string'?f().find(v=>v.id===id):undefined});
const EVM=look(EVp),PM=look(()=>P),POM=look(POSTp),NTM=look(NTp);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const newId=(prefix,arr)=>{let n=arr.length+1,id;do{id=prefix+(n++)}while(arr.some(x=>x.id===id));return id};

/* ---------- public writes (no auth needed) ---------- */
async function recordOrder(ev,info,items,method){
  const total=items.reduce((s,[n,q])=>{const t=ev.tickets.find(x=>x[0]===n);return s+(t?t[1]*q:0)},0);
  const data=await apiFetch('orders',{method:'POST',body:JSON.stringify({eventId:ev.id,name:info.name,email:info.email,phone:info.phone,items,total,method:total?method:'Free'})});
  ORDERS.unshift(data);return data;
}
async function recordDonation(d){
  const data=await apiFetch('donations',{method:'POST',body:JSON.stringify(d)});
  DONS.unshift(data);return data;
}
async function recordMessage(m){
  const data=await apiFetch('messages',{method:'POST',body:JSON.stringify(m)});
  MSGS.unshift(data);return data;
}

/* ---------- auth ---------- */
async function apiLogin(email,password){
  const data=await apiFetch('auth/login',{method:'POST',body:JSON.stringify({email,password})});
  AUTH_TOKEN=data.token;localStorage.setItem('sanatani_token',data.token);
  return data.user;
}
function apiLogout(){AUTH_TOKEN=null;localStorage.removeItem('sanatani_token')}
function isLoggedIn(){return!!AUTH_TOKEN}

async function adminDelete(type,id){await apiFetch(type+'/'+id,{method:'DELETE'});const arr=COLLECTIONS[type==='albums'?'albums':type==='partners'?'partners':type];const i=arr.findIndex(x=>x.id===id);if(i>-1)arr.splice(i,1)}
async function adminTogglePub(type,id){const data=await apiFetch(type+'/'+id+'/pub',{method:'PATCH'});const arr=COLLECTIONS[type==='albums'?'albums':type==='partners'?'partners':type];const item=arr.find(x=>x.id===id);if(item)item.pub=data.pub;return data}

let CAL=null;
function calView(){
  if(!CAL){const n=byStatus('upcoming')[0]||byStatus('ongoing')[0]||EVp()[0],p=parts(n.start);CAL={y:p.y,m:p.m-1,sel:null}}
  const {y,m}=CAL,mp={};
  EVp().forEach(e=>{const a=parts(e.start),b=parts(e.end);for(let t=Date.UTC(a.y,a.m-1,a.d),end=Date.UTC(b.y,b.m-1,b.d);t<=end;t+=864e5){const k=new Date(t).toISOString().slice(0,10);(mp[k]=mp[k]||[]).push(e)}});
  const lead=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),tp=parts(new Date().toISOString());
  let cells='';for(let i=0;i<lead;i++)cells+='<div class="cal-d off"></div>';
  for(let d=1;d<=dim;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,evs=mp[k]||[],isT=tp.y===y&&tp.m===m+1&&tp.d===d;
    cells+=evs.length?`<button class="cal-d has ${isT?'today':''} ${CAL.sel===k?'sel':''}" data-act="cal-day" data-k="${k}" aria-label="${d} ${MN[m]}: ${esc(evs.map(e=>e.title).join(', '))}"><b>${d}</b><span class="cal-t">${esc(evs[0].title)}</span></button>`:`<div class="cal-d ${isT?'today':''}"><span>${d}</span></div>`}

  const uniq=[...new Set(monthEvs)].sort((a,b)=>+new Date(a.start)-+new Date(b.start));
  return `<div class="cal-h"><button class="ib" data-act="cal-prev" aria-label="Previous month">${I('left',22)}</button><h2>${MN[m]} ${y}</h2><button class="ib" data-act="cal-next" aria-label="Next month">${I('chev',22)}</button></div><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-w">${d}</div>`).join('')}${cells}</div><div style="margin-top:1.6rem"><h3>${CAL.sel?'On '+dShort(CAL.sel+'T12:00:00+06:00'):'This month'}</h3>${uniq.length?`<div class="grid">${uniq.map(evCard).join('')}</div>`:'<p class="soft">Nothing scheduled. Tap a highlighted date to open its event.</p>'}</div>`;
}

const parse=()=>decodeURIComponent((location.hash||'').replace(/^#\/?/,''));
let curPath=null;
function render(){
  const path=parse();curPath=path;const [a,b]=path.split('/');let r;
  if(a==='admin'){document.body.classList.add('is-admin');renderAdmin(path);return}
  document.body.classList.remove('is-admin');if(shellDirty){shell();shellDirty=false}
  try{
    switch(a){case'':r=V.home();break;case'about':r=V.about();break;case'events':r=V.events(b);break;case'event':r=V.event(b);break;case'tickets':r=V.tickets(b);break;case'gallery':r=V.gallery(b);break;case'blog':r=V.blog(b);break;case'culture':r=V.culture(b);break;case'post':case'article':r=V.post(b);break;case'partners':r=V.partners();break;case'achievements':r=V.achievements();break;case'donate':r=V.donate();break;case'contact':r=V.contact();break;case'notices':r=V.notices();break;case'notice':r=V.notice(b);break;default:r=notFound()}
  }catch(err){console.error(err);r={t:'Error',h:head('Something went wrong','Please reload the page.')}}
  $('#app').innerHTML=r.h;document.title=(r.t?r.t+' | ':'')+SETTINGS.siteName+' — '+SETTINGS.university;
  const key={event:'events',post:'blog',article:'culture',tickets:null,notice:null,notices:null}[a];const k=key!==undefined?key:a;
  $$('[data-nav]').forEach(x=>x.getAttribute('data-nav')===k?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));
  closeMenu();window.scrollTo(0,0);tick();
}
function go(p){try{if(parse()!==p)location.hash='#/'+p}catch(e){}if(curPath!==p)render()}
window.addEventListener('hashchange',()=>{if(parse()!==curPath)render()});

/* ---------- countdown ---------- */
function tick(){
  $$('[data-cd]').forEach(el=>{
    const s=+new Date(el.dataset.cd),e=+new Date(el.dataset.end),n=Date.now();
    if(n>=s){el.innerHTML=`<p class="cd-done">${n<=e?'Happening now':'Event completed'}</p>`;el.removeAttribute('data-cd');return}
    let d=Math.floor((s-n)/1000);const v={d:Math.floor(d/86400),h:Math.floor(d%86400/3600),m:Math.floor(d%3600/60),s:d%60};
    for(const k in v){const b=$(`[data-u="${k}"]`,el);if(b)b.textContent=String(v[k]).padStart(2,'0')}
  });
}
setInterval(tick,1000);

function search(q){
  q=q.trim().toLowerCase();const out=$('#res');if(!q){out.innerHTML='';return}

   ['News and culture',POSTp().filter(p=>hit(p.title+' '+p.x+' '+p.cat)).map(p=>[p.title,p.cat,(p.kind==='culture'?'article/':'post/')+p.id])],

   ['Notices',NTp().filter(n=>hit(n.title+' '+n.short)).map(n=>[n.title,dShort(n.date),'notice/'+n.id])],
   ['Partners',P.filter(p=>hit(p.name+' '+p.kind)).map(p=>[p.name,p.kind,'partners'])]].filter(g=>g[1].length);

/* form engine */
function opts(f){return typeof f.opts==='function'?f.opts():f.opts}
function fieldHtml(f,d,err){
  if(f.show && !f.show(d)) return '';
  const v=d[f.k],id='ff-'+f.k,a=`id="${id}" data-fk="${f.k}" ${err[f.k]?'aria-invalid="true"':''} ${f.refresh?'data-refresh="1"':''}`;let inp;
  switch(f.t){
    case'area':inp=`<textarea ${a} rows="${f.rows||3}">${esc(v||'')}</textarea>`;break;
    case'paras':inp=`<textarea ${a} rows="7">${esc((v||[]).join('\n\n'))}</textarea>`;break;
    case'select':inp=`<select ${a}>${opts(f).map(([o,l])=>`<option value="${esc(o)}" ${String(v==null?'':v)===String(o)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;break;
    case'check':inp=`<label class="chk"><input type="checkbox" ${a} ${(v==null?f.def:v)?'checked':''}> ${f.chk}</label>`;break;
    case'toggle':inp=`<div class="seg" role="group">${opts(f).map(([o,l])=>`<button type="button" data-ad="toggle" data-fk="${f.k}" data-val="${esc(o)}" aria-pressed="${String(v)===String(o)}">${l}</button>`).join('')}</div>`;break;
    case'cover':{const cm=d.coverMode||'art',fr=d.coverFrame||'arch';
      const ratioMap={arch:'10:11.5',rect:'16:10',circle:'1:1'};
      const toggleHtml=`<div class="seg" role="group"><button type="button" data-ad="cover-toggle" data-val="art" aria-pressed="${cm==='art'}">Generated art</button><button type="button" data-ad="cover-toggle" data-val="image" aria-pressed="${cm==='image'}">Upload image</button></div>`;
      const artHtml=cm!=='image'?`<div class="cover-opts"><div class="field"><label>Cover art</label><select data-fk="motif" data-refresh="1">${MOTIFS.map(([o,l])=>`<option value="${esc(o)}" ${d.motif===o?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Cover colours</label><select data-fk="palKey" data-refresh="1">${PALS.map(([o,l])=>`<option value="${esc(o)}" ${d.palKey===o?'selected':''}>${l}</option>`).join('')}</select></div></div>`:'';
      const frameHtml=cm==='image'?`<div class="cover-opts"><div class="field"><label>Image frame</label><div class="seg" role="group"><button type="button" data-ad="cover-frame" data-val="arch" aria-pressed="${fr==='arch'}">${I('arch',16)} Arch</button><button type="button" data-ad="cover-frame" data-val="rect" aria-pressed="${fr==='rect'}">${I('rect',16)} Rectangle</button><button type="button" data-ad="cover-frame" data-val="circle" aria-pressed="${fr==='circle'}">${I('circle',16)} Circle</button></div><p class="soft" style="margin:.4rem 0 0;font-size:.82rem">Recommended ratio: ${ratioMap[fr]||'10:11.5'}</p></div></div>`:'';
      const imgHtml=cm==='image'?`<div class="img-up${d.coverImage?' has':''}" data-fk="coverImage">${d.coverImage?`<img src="${d.coverImage}" alt="Cover image preview">`:''}<label class="img-up-btn"><input type="file" accept="image/*" data-ad="img-pick" data-fk="coverImage" hidden>${d.coverImage?`${I('edit',16)}Change image`:`${I('img',16)}Choose image`}</label>${d.coverImage?`<button class="img-up-rm" data-ad="cover-img-rm" data-fk="coverImage" aria-label="Remove image">${I('trash',16)}Remove</button>`:''}</div>`:'';
      inp=`<div class="cover-section">${toggleHtml}<div class="cover-body">${cm==='image'?imgHtml+frameHtml:artHtml}</div></div>`;break}
    case'hero':{const hs=d.heroStyle||'palette';
      const hc=d.heroColors&&d.heroColors.length===2?d.heroColors:['#8a1c30','#3d0a14'];
      const toggleHtml=`<div class="seg" role="group"><button type="button" data-ad="hero-style" data-val="palette" aria-pressed="${hs==='palette'}">Palette</button><button type="button" data-ad="hero-style" data-val="gradient" aria-pressed="${hs==='gradient'}">Custom gradient</button><button type="button" data-ad="hero-style" data-val="image" aria-pressed="${hs==='image'}">Image background</button></div>`;
      let body='';

        body=`<div class="hero-preview" style="background:linear-gradient(135deg,${p[0]},${p[1]});height:60px;border-radius:8px;margin-top:.5rem"></div><p class="soft" style="margin:.3rem 0 0;font-size:.82rem">Uses the event's palette colours automatically.</p>`;
      }else if(hs==='gradient'){
        body=`<div class="cover-opts" style="margin-top:.5rem"><div class="field"><label>First colour</label><input type="color" data-ad="hero-color" data-idx="0" value="${esc(hc[0])}"></div><div class="field"><label>Second colour</label><input type="color" data-ad="hero-color" data-idx="1" value="${esc(hc[1])}"></div></div><div class="hero-preview" style="background:linear-gradient(135deg,${hc[0]},${hc[1]});height:60px;border-radius:8px;margin-top:.5rem"></div>`;
      }else{
        body=d.heroImage
          ?`<div class="img-up has" data-fk="heroImage"><img src="${d.heroImage}" alt="Hero background preview"><label class="img-up-btn"><input type="file" accept="image/*" data-ad="hero-img-pick" data-fk="heroImage" hidden>${I('edit',16)}Change image</label><button class="img-up-rm" data-ad="hero-img-rm" data-fk="heroImage" aria-label="Remove image">${I('trash',16)}Remove</button></div><p class="soft" style="margin:.4rem 0 0;font-size:.82rem">Full-width background. Recommended ratio: 21:9</p>`

    case'color':inp=`<input type="color" ${a} value="${esc(v||'#8A1C30')}">`;break;
    case'vid':inp=`<input ${a} value="${esc((v||[]).join(', '))}" placeholder="e.g. 3, 9">`;break;

    case'rows':inp=`<div class="rows">${(v||[]).map((r,i)=>`<div class="row" style="--cols:${f.cols.map(c=>c.w||'1fr').join(' ')}">${f.cols.map((c,j)=>`<input data-fk="${f.k}" data-r="${i}" data-c="${j}" placeholder="${c.l}" aria-label="${c.l}" ${c.t==='num'?'type="number" min="0"':''} value="${esc(r[j]==null?'':r[j])}">`).join('')}<button class="ib danger" data-ad="row-del" data-k="${f.k}" data-r="${i}" aria-label="Remove row">${I('trash',18)}</button></div>`).join('')}<div><button class="btn btn-ghost btn-sm" data-ad="row-add" data-k="${f.k}">${I('plus',16)}Add row</button></div></div>`;break;
    default:inp=`<input ${a} value="${esc(v==null?'':v)}">`;
  }

}
function collect(fields,d){
  const root=$('#admin');
  fields.forEach(f=>{
    const els=$$(`[data-fk="${f.k}"]`,root);
    if(f.t==='rows'){const rows=[];els.forEach(el=>{const r=+el.dataset.r,c=+el.dataset.c;(rows[r]=rows[r]||[])[c]=el.value});d[f.k]=rows.filter(Boolean).map(r=>f.cols.map((c,j)=>c.t==='num'?Number(r[j])||0:String(r[j]||'').trim())).filter(r=>r.some((x,j)=>f.cols[j].t!=='num'&&x));return}
    if(f.t==='image')return;
    if(f.t==='cover')return;
    if(f.t==='hero')return;
    if(!els.length)return;const el=els[0];
    switch(f.t){case'check':d[f.k]=el.checked;break;case'multi':d[f.k]=els.filter(x=>x.checked).map(x=>x.value);break;case'paras':d[f.k]=el.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);break;case'dt':d[f.k]=el.value?el.value+':00+06:00':'';break;case'num':d[f.k]=Number(el.value)||0;break;case'vid':d[f.k]=el.value.split(',').map(x=>parseInt(x,10)).filter(n=>!isNaN(n)&&n>=0);break;default:d[f.k]=el.value.trim()}
  });
}

async function saveDraft(){
  const dr=AD.draft;if(!dr)return;const c=CFG[dr._name],d=dr.o,isNew=dr._id==='new';
  collect(c.fields,d);const err={};
  c.fields.forEach(f=>{if(!f.req)return;const v=d[f.k];if(v==null||v===''||(Array.isArray(v)&&!v.length))err[f.k]='This field is required.'});
  if(c.validate)Object.assign(err,c.validate(d,isNew));
  dr.err=err;
  if(Object.keys(err).length){renderAdmin(AD.path);toast('Fix the highlighted fields.');return}
  if(c.before)c.before(d,isNew);
  const type=c.route||c.name;
  try{
    if(c.singleton){c.put(d);await apiFetch(type,{method:'PUT',body:JSON.stringify(d)})}
    else if(isNew){const data=await apiFetch(type,{method:'POST',body:JSON.stringify(d)});c.coll.push(data)}
    else{const data=await apiFetch(type+'/'+dr._id,{method:'PUT',body:JSON.stringify(d)});const i=c.coll.findIndex(x=>x.id===dr._id);if(i>-1)c.coll[i]=data}
    AD.draft=null;toast(c.single+' saved.');
    if(c.singleton)renderAdmin(AD.path);else adminGo('admin/'+c.route);
  }catch(err){toast('Save failed: '+err.message)}
}

function chart14(){

}

  if(AD.draft&&(AD.draft._name!==(pg==='gallery'?'albums':pg)||AD.draft._id!==arg))AD.draft=null;
  let r;
  if(!PAGES[pg])r=notFoundAd();else if(!can(pg))r={t:'No access',b:`<div class="card"><h3>This page is not available for your role</h3><p>Ask an Admin to change your role.</p></div>`};else r=PAGES[pg](arg);
  root.innerHTML=layout(pg,r.t,r.b);window.scrollTo(0,same?y:0);
}
const openModal=h=>{AD.modal=h;renderAdmin(AD.path)},closeModal=()=>{AD.modal=null;renderAdmin(AD.path)};
function refreshList(){const el=$('#adm-list');if(!el)return;if(AD.list==='orders')el.innerHTML=ordersTable();else if(CFG[AD.list])el.innerHTML=listTable(AD.list,1)}

/* events */
const adminEl=()=>$('#admin');
document.addEventListener('click',e=>{
  const b=e.target.closest('#admin [data-ad]');if(!b)return;const a=b.dataset.ad;
  switch(a){
    case'side':AD.side=!AD.side;$('.ad').classList.toggle('open',AD.side);break;
    case'theme':theme();break;
    case'toast':toast(b.dataset.m);break;
    case'login':{const p=$('#l-p').value,em=$('#l-e').value.trim(),role=$('#l-r').value;if(!p||!em){$('#l-err').hidden=false;break}
      apiLogin(em,p).then(user=>{AD.user=user;loadDB().then(()=>adminGo(role==='Volunteer'?'admin/checkin':'admin'))}).catch(()=>{$('#l-err').hidden=false});break}
    case'logout':AD.user=null;AD.draft=null;apiLogout();adminGo('admin');break;
    case'modal-bg':if(e.target===b)closeModal();break;
    case'modal-close':closeModal();break;
    case'save':saveDraft();break;
    case'row-add':case'row-del':{const dr=AD.draft,c=CFG[dr._name];collect(c.fields,dr.o);const f=c.fields.find(x=>x.k===b.dataset.k);dr.o[f.k]=dr.o[f.k]||[];if(a==='row-add')dr.o[f.k].push(f.cols.map(x=>x.t==='num'?0:''));else dr.o[f.k].splice(+b.dataset.r,1);renderAdmin(AD.path);break}
    case'pub':{const c=CFG[b.dataset.n];adminTogglePub(c.route||c.name,b.dataset.id).then(()=>{refreshList();toast('Updated.')}).catch(()=>toast('Failed.'));break}
    case'ask-del':{const c=CFG[b.dataset.n];openModal(`<h3>Delete this ${c.single.toLowerCase()}?</h3><p class="soft">It will disappear from the website. This cannot be undone.</p><div class="btns"><button class="btn btn-ghost" data-ad="modal-close">Cancel</button><button class="btn btn-danger" data-ad="do-del" data-n="${c.name}" data-id="${b.dataset.id}">Delete</button></div>`);break}
    case'do-del':{const c=CFG[b.dataset.n];adminDelete(c.route||c.name,b.dataset.id).then(()=>{AD.modal=null;AD.draft=null;toast(c.single+' deleted.');if(AD.path.split('/')[2])adminGo('admin/'+c.route);else renderAdmin(AD.path)}).catch(()=>toast('Delete failed.'));break}
    case'ask-reset':openModal(`<h3>Reset demo data?</h3><p class="soft">Everything you added or changed here goes back to the sample set.</p><div class="btns"><button class="btn btn-ghost" data-ad="modal-close">Cancel</button><button class="btn btn-danger" data-ad="do-reset">Reset</button></div>`);break;
    case'do-reset':{AD.modal=null;AD.draft=null;loadDB().then(()=>{shellDirty=true;toast('Data reloaded from server.');renderAdmin(AD.path)}).catch(()=>toast('Failed to reload.'));break}
    case'order':orderModal(b.dataset.id);break;
    case'order-paid':case'order-cancel':{const o=byId(ORDERS,b.dataset.id);const newStatus=a==='order-paid'?'paid':'cancelled';apiFetch('orders/'+o.id+'/status',{method:'PATCH',body:JSON.stringify({status:newStatus})}).then(()=>{o.status=newStatus;if(newStatus==='cancelled')o.tickets=[];AD.modal=null;renderAdmin(AD.path);toast(a==='order-paid'?'Order marked as paid.':'Order cancelled.')} ).catch(()=>toast('Failed.'));break}
    case'ck-verify':{const code=$('#ck-in').value,r=findTicket(code);AD.ck.res=!r?{kind:'bad',code:code.trim()}:{kind:r.o.status==='paid'&&!r.t.used?'ok':'warn',o:r.o,t:r.t};renderAdmin(AD.path);const i=$('#ck-in');if(i)i.focus();break}
    case'ck-admit':{const r=findTicket(b.dataset.id);r.t.used=true;saveDB();AD.log.unshift({id:r.t.id,name:r.o.name,at:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});AD.ck.res=null;renderAdmin(AD.path);toast('Admitted.');break}
    case'msg':{const m=byId(MSGS,b.dataset.id);apiFetch('messages/'+m.id+'/read',{method:'PATCH'}).then(()=>{m.read=true;saveDB();openModal(`<h3>${esc(m.subject)}</h3><p class="soft">${esc(m.name)}, ${esc(m.email)}<br>${dtm(m.at)}</p><div class="msg-b">${esc(m.body)}</div><div class="btns"><button class="btn btn-ghost" data-ad="modal-close">Close</button><button class="btn btn-ghost" data-ad="msg-unread" data-id="${m.id}">Mark as unread</button><a class="btn" href="mailto:${esc(m.email)}?subject=Re: ${esc(m.subject)}">Reply by email</a><button class="btn btn-danger" data-ad="msg-del" data-id="${m.id}">Delete</button></div>`)}).catch(()=>toast('Failed.'));break}
    case'msg-unread':{const m=byId(MSGS,b.dataset.id);apiFetch('messages/'+m.id+'/read',{method:'PATCH'}).then(()=>{m.read=false;saveDB();closeModal()}).catch(()=>toast('Failed.'));break}
    case'msg-del':{apiFetch('messages/'+b.dataset.id,{method:'DELETE'}).then(()=>{MSGS.splice(MSGS.findIndex(m=>m.id===b.dataset.id),1);saveDB();closeModal();toast('Message deleted.')}).catch(()=>toast('Failed.'));break}
    case'img-rm':case'cover-img-rm':{if(AD.draft){AD.draft.o[b.dataset.fk]='';collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
    case'toggle':{if(AD.draft){AD.draft.o[b.dataset.fk]=b.dataset.val;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
    case'cover-toggle':{if(AD.draft){AD.draft.o.coverMode=b.dataset.val;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
    case'cover-frame':{if(AD.draft){AD.draft.o.coverFrame=b.dataset.val;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
    case'hero-style':{if(AD.draft){AD.draft.o.heroStyle=b.dataset.val;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
    case'hero-img-rm':{if(AD.draft){AD.draft.o.heroImage='';collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}break}
  }
});
document.addEventListener('input',e=>{if(e.target.matches('#admin [data-ad-q]')){AD.q=e.target.value;refreshList()}});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.closest||!t.closest('#admin'))return;
  if(t.dataset.adF){AD[t.dataset.adF]=t.value;refreshList()}
  if(t.dataset.ad==='img-pick'&&t.files&&t.files[0]&&AD.draft){
    apiUpload(t.files[0]).then(res=>{AD.draft.o[t.dataset.fk]=res.url;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}).catch(()=>toast('Upload failed.'));return;
  }
  if(t.dataset.ad==='hero-img-pick'&&t.files&&t.files[0]&&AD.draft){
    apiUpload(t.files[0]).then(res=>{AD.draft.o.heroImage=res.url;collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path)}).catch(()=>toast('Upload failed.'));return;
  }
  if(t.dataset.ad==='hero-color'&&AD.draft){
    const hc=AD.draft.o.heroColors&&AD.draft.o.heroColors.length===2?[...AD.draft.o.heroColors]:['#8a1c30','#3d0a14'];
    hc[+t.dataset.idx]=t.value;AD.draft.o.heroColors=hc;
    collect(CFG[AD.draft._name].fields,AD.draft.o);renderAdmin(AD.path);return;
  }
  if(t.dataset.refresh&&AD.draft){const c=CFG[AD.draft._name];collect(c.fields,AD.draft.o);renderAdmin(AD.path)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('l-')&&!AD.user){const b=$('#admin [data-ad="login"]');if(b)b.click()}
  if(e.key==='Enter'&&e.target.id==='ck-in'){const b=$('#admin [data-ad="ck-verify"]');if(b)b.click()}
  if(e.key==='Escape'&&AD.modal&&document.body.classList.contains('is-admin'))closeModal();
});

/* ---------- boot ---------- */
shell();
loadDB().then(()=>{shellDirty=true;render()});

})();
</script>
</body>
</html>
